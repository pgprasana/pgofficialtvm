<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Affiliate Link Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        input, button {
            padding: 10px;
            margin: 10px;
            width: 80%;
        }
        #affiliate-link {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h2>Amazon Affiliate Link Generator</h2>
    <input type="text" id="product-url" placeholder="Enter Amazon Product Link">
    <button onclick="generateAffiliateLink()">Generate Affiliate Link</button>
    <p id="error-message" style="color: red;"></p>
    <div id="affiliate-link">
        <p>Your Affiliate Link:</p>
        <a id="amazon-affiliate-link" href="#" target="_blank"></a>
    </div>

    <script>
     async function expandShortLink(shortLink) {
    try {
        const response = await fetch(shortLink, { method: 'HEAD', redirect: 'follow' });
        return response.url; // The final redirected URL
    } catch (error) {
        console.error("Failed to expand short link", error);
        alert("Failed to expand short link. Open it in a browser and copy the full product URL.");
        return null;
    }
}

// Usage
expandShortLink("https://amzn.in/d/18LA364").then(fullURL => {
    if (fullURL) {
        console.log("Expanded URL:", fullURL);
    }
});

    </script>
</body>
</html>
