<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Affiliate Link Generator</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 50px; }
        input, button { padding: 10px; margin: 10px; width: 80%; }
        #affiliate-link { margin-top: 20px; display: none; }
    </style>
</head>
<body>
    <h2>Amazon Affiliate Link Generator</h2>
    <input type="text" id="product-url" placeholder="Paste Amazon Product Link">
    <button onclick="generateAffiliateLink()">Generate Affiliate Link</button>
    <div id="affiliate-link">
        <p>Your Affiliate Link:</p>
        <a id="amazon-affiliate-link" href="#" target="_blank">Buy Now</a>
    </div>

    <iframe id="url-expander" style="display:none;"></iframe>

    <script>
        const AFFILIATE_TAG = "pgstudio-21"; // Replace with your tag

        function generateAffiliateLink() {
            let productUrl = document.getElementById("product-url").value.trim();
            if (!productUrl) {
                alert("Please enter a valid Amazon product link");
                return;
            }

            // Check if it's a short link
            if (productUrl.includes("amzn.in")) {
                let iframe = document.getElementById("url-expander");
                iframe.src = productUrl;
                iframe.onload = function() {
                    let expandedUrl = iframe.contentWindow.location.href;
                    createAffiliateLink(expandedUrl);
                };
            } else {
                createAffiliateLink(productUrl);
            }
        }

        function createAffiliateLink(url) {
            let finalUrl = new URL(url);
            finalUrl.searchParams.set("tag", AFFILIATE_TAG);

            document.getElementById("amazon-affiliate-link").href = finalUrl.href;
            document.getElementById("amazon-affiliate-link").innerText = "Buy Now with Affiliate Link";
            document.getElementById("affiliate-link").style.display = "block";
        }
    </script>
</body>
</html>
