<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PG Official TVM - Products</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      padding: 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    .header h1 {
      font-size: 26px;
      margin-top: 10px;
    }

    .search-box {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }

    .search-box input {
      padding: 10px;
      font-size: 16px;
      border: 2px solid #fff;
      background-color: transparent;
      color: #fff;
      border-radius: 5px 0 0 5px;
      width: 250px;
    }

    .search-box button {
      padding: 10px 20px;
      background-color: #fff;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 0 5px 5px 0;
      cursor: pointer;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background-color: #111;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      filter: grayscale(100%);
      margin-bottom: 10px;
    }

    .product-card h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .product-card p {
      font-size: 14px;
      color: #aaa;
    }

    .product-card a {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background-color: #fff;
      color: #000;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 40px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="https://via.placeholder.com/80" alt="Logo">
    <h1>PG Official TVM</h1>
  </div>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search products...">
    <button onclick="searchProducts()">Search</button>
  </div>

  <div class="product-grid" id="productGrid">
    <div class="product-card">
      <img src="https://via.placeholder.com/200" alt="Smartphone Stand">
      <h3>Smartphone Stand</h3>
      <p>Perfect for hands-free watching.</p>
      <a href="#">Buy Now</a>
    </div>
    <div class="product-card">
      <img src="https://via.placeholder.com/200" alt="Wireless Earbuds">
      <h3>Wireless Earbuds</h3>
      <p>Great sound & battery life.</p>
      <a href="#">Buy Now</a>
    </div>
    <div class="product-card">
      <img src="https://via.placeholder.com/200" alt="Portable Blender">
      <h3>Portable Blender</h3>
      <p>Blend smoothies on the go.</p>
      <a href="#">Buy Now</a>
    </div>
  </div>

  <div class="footer">
    <p>&copy; 2025 PG Official TVM. All rights reserved.</p>
  </div>

  <script>
    function searchProducts() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.product-card');
      cards.forEach(card => {
        const title = card.querySelector('h3').textContent.toLowerCase();
        if (title.includes(input)) {
          card.style.display = "block";
        } else {
          card.style.display = "none";
        }
      });
    }
  </script>

</body>
</html>
