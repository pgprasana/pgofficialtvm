<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PG Official TVM - Products</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      padding: 30px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid white;
    }

    .header h1 {
      font-size: 28px;
      color: #fff;
      margin-top: 10px;
    }

    .search-box {
      max-width: 400px;
      margin: 0 auto 30px;
      display: flex;
    }

    .search-box input {
      flex: 1;
      padding: 10px 15px;
      border: 2px solid #fff;
      background: transparent;
      color: #fff;
      border-radius: 6px 0 0 6px;
      font-size: 16px;
    }

    .search-box button {
      padding: 10px 20px;
      border: none;
      background-color: #fff;
      color: #000;
      font-weight: bold;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background-color: #111;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.05);
      padding: 15px;
      text-align: center;
    }

    .product-card img {
      width: 100%;
      height: 180px;
      object-fit: contain;
      margin-bottom: 10px;
      filter: grayscale(100%);
    }

    .product-card h3 {
      font-size: 16px;
      color: #fff;
      margin-bottom: 8px;
    }

    .product-card p {
      font-size: 14px;
      color: #aaa;
    }

    .product-card a {
      display: inline-block;
      margin-top: 10px;
      background-color: #fff;
      color: #000;
      padding: 8px 16px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
    }

    .footer {
      margin-top: 50px;
      text-align: center;
    }

    .footer p {
      font-size: 14px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="https://via.placeholder.com/80" alt="Logo">
    <h1>PG Official TVM</h1>
  </div>

  <div class="search-box">
    <input type="text" placeholder="Search for products..." id="searchInput">
    <button onclick="searchProducts()">Search</button>
  </div>

  <div class="product-grid" id="productGrid">

    <div class="product-card">
      <img src="https://via.placeholder.com/200" alt="Product 1">
      <h3>Smartphone Stand</h3>
      <p>Perfect for watching videos hands-free.</p>
      <a href="#">Buy on Amazon</a>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/200" alt="Product 2">
      <h3>Wireless Earbuds</h3>
      <p>Crystal-clear sound and long battery life.</p>
      <a href="#">Buy on Amazon</a>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/200" alt="Product 3">
      <h3>Portable Blender</h3>
      <p>Make smoothies on the go.</p>
      <a href="#">Buy on Amazon</a>
    </div>

  </div>

  <div class="footer">
    <p>&copy; 2025 PG Official TVM. All rights reserved.</p>
  </div>

  <script>
    function searchProducts() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.product-card');
      cards.forEach(card => {
        const title = card.querySelector('h3').textContent.toLowerCase();
        card.style.display = title.includes(input) ? 'block' : 'none';
      });
    }
  </script>

</body>
</html>
